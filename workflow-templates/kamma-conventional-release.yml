name: Conventional Release

# Kamma shared workflow template for the conventional-commits release flow.
# See https://docs.kammadata.com/#/development/release_strategy

on:
  pull_request:
  push:
    branches:
      - main
      - integration
      - 'hotfix/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint every commit in the PR against the Kamma conventional-commits format.
  # Uses the same bash regex as the local .githooks/commit-msg hook — single
  # source of truth, no Node tooling required.
  commit-lint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate commit subjects
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          VALID_TYPES="feat|fix|perf|refactor|test|docs|chore|style|build|ci|revert"
          VALID_REGEX="^(${VALID_TYPES})\(KAM-[0-9]+\)!?: .+$"
          EXEMPT_REGEX="^(\[GitHub Action:|\[Auto-Deploy\]|\[Manual Deploy\]|Merge (pull request|branch|remote-tracking|commit) |Revert )"

          failed=0
          while IFS=$'\t' read -r sha subject; do
            if [[ "$subject" =~ $EXEMPT_REGEX ]]; then
              echo "skip   $sha  $subject"
              continue
            fi
            if [[ "$subject" =~ $VALID_REGEX ]] && [ "${#subject}" -le 72 ]; then
              echo "ok     $sha  $subject"
            else
              echo "::error::commit $sha does not match conventional-commits format: $subject"
              failed=1
            fi
          done < <(git log --format=$'%H\t%s' "$BASE_SHA..$HEAD_SHA")

          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "Required format: <type>(KAM-XXXX): <imperative description>"
            echo "Reference: https://docs.kammadata.com/#/development/commit_strategy"
            exit 1
          fi

  # Lint the PR title using the same bash regex — guards against squash-merge
  # subjects (if ever enabled) and keeps the PR title human-meaningful.
  pr-title:
    name: PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          VALID_TYPES="feat|fix|perf|refactor|test|docs|chore|style|build|ci|revert"
          VALID_REGEX="^(${VALID_TYPES})\(KAM-[0-9]+\)!?: .+$"
          if [[ "$TITLE" =~ $VALID_REGEX ]] && [ "${#TITLE}" -le 72 ]; then
            echo "PR title OK: $TITLE"
          else
            echo "::error::PR title must match: <type>(KAM-XXXX): <description>"
            echo "::error::Got: $TITLE"
            echo "Reference: https://docs.kammadata.com/#/development/commit_strategy"
            exit 1
          fi

  # Cut a GitHub release on every merge to main. Version + notes derive from
  # the conventional commits since the last tag.
  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.semver.outputs.next }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next semver version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ github.token }}
          branch: main
          patchList: fix, bugfix, perf, refactor, test, tests, docs, chore, style, build, ci

      # Build the release notes inline from conventional commits. Same regex
      # as .githooks/commit-msg + the PR commit-lint step. We don't use
      # requarks/changelog-action — it can't handle SHAs and errors with
      # "Couldn't find any commits" on perfectly valid commit ranges.
      - name: Build categorised changelog
        id: changelog
        env:
          FROM_TAG: ${{ steps.semver.outputs.current }}
        run: |
          set -euo pipefail

          declare -A categories=(
            [feat]=":sparkles: New Features"
            [fix]=":bug: Bug Fixes"
            [perf]=":rocket: Performance Improvements"
            [refactor]=":recycle: Refactors"
            [test]=":white_check_mark: Tests"
            [docs]=":book: Documentation"
            [chore]=":wrench: Chores"
            [style]=":art: Code Style"
            [build]=":hammer: Build System"
            [ci]=":gear: CI"
            [revert]=":rewind: Reverts"
          )
          ORDER=(feat fix perf refactor test docs chore style build ci revert)

          declare -A sections
          while IFS=$'\t' read -r sha subject; do
            [ -z "$sha" ] && continue
            short="${sha:0:7}"
            if [[ "$subject" =~ ^(feat|fix|perf|refactor|test|docs|chore|style|build|ci|revert)\((KAM-[0-9]+)\)(!)?:[[:space:]]+(.+)$ ]]; then
              type="${BASH_REMATCH[1]}"
              scope="${BASH_REMATCH[2]}"
              bang="${BASH_REMATCH[3]}"
              desc="${BASH_REMATCH[4]}"
              breaking=""
              [ -n "$bang" ] && breaking=" **[BREAKING]**"
              sections[$type]+="- [\`${short}\`] - **${scope}**${breaking}: ${desc}"$'\n'
            fi
          done < <(git log --format=$'%H\t%s' --no-merges "${FROM_TAG}..HEAD")

          {
            echo "changes<<__CHANGELOG_EOF__"
            total=0
            for type in "${ORDER[@]}"; do
              body="${sections[$type]:-}"
              if [ -n "$body" ]; then
                printf '### %s\n\n%s\n' "${categories[$type]}" "$body"
                total=$((total + 1))
              fi
            done
            if [ "$total" -eq 0 ]; then
              echo "_No conventional commits found since ${FROM_TAG}._"
            fi
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"

          # Log the rendered changelog to stderr for inspection in the run log.
          # Use `if` (not `&&`) so the loop's exit code stays 0 — under set -e
          # a falsy test in the last iteration would abort the step.
          {
            echo "---"
            echo "Generated changelog from ${FROM_TAG}..HEAD:"
            for type in "${ORDER[@]}"; do
              body="${sections[$type]:-}"
              if [ -n "$body" ]; then
                printf '### %s\n\n%s\n' "${categories[$type]}" "$body"
              fi
            done
          } >&2

      - name: Update automated.version
        run: echo "${{ steps.semver.outputs.next }}" > automated.version

      - name: Commit automated.version
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "[GitHub Action: Version]"
          commit_author: kamma-github-actions <github@kammadata.com>
          branch: main
          file_pattern: automated.version

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.semver.outputs.next }}
          tag_name: ${{ steps.semver.outputs.next }}
          body: ${{ steps.changelog.outputs.changes }}

  # Hotfix back-merge: opens a PR from main → integration so prod fixes
  # land in the development track too. Triggered after release succeeds.
  hotfix-back-merge:
    name: Back-merge to integration
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check if this release came from a hotfix
        id: hotfix-check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Look at the most recent merge commit's PR. If the source branch
          # was hotfix/*, open a back-merge PR.
          MERGE_COMMIT=$(git log --merges --pretty=%H -1)
          if [ -z "$MERGE_COMMIT" ]; then
            echo "is_hotfix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_REF=$(gh api "repos/${{ github.repository }}/commits/$MERGE_COMMIT/pulls" \
            --jq '.[0].head.ref' 2>/dev/null || echo "")
          if [[ "$HEAD_REF" == hotfix/* ]]; then
            echo "is_hotfix=true" >> "$GITHUB_OUTPUT"
            echo "source_ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "is_hotfix=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Open back-merge PR
        if: steps.hotfix-check.outputs.is_hotfix == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_REF: ${{ steps.hotfix-check.outputs.source_ref }}
        run: |
          BRANCH="back-merge/main-to-integration-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name kamma-github-actions
          git config user.email github@kammadata.com
          git fetch origin integration
          git checkout -b "$BRANCH" origin/integration
          git merge origin/main --no-ff -m "chore(KAM-0000): back-merge main into integration after hotfix"
          git push origin "$BRANCH"
          BODY=$(printf 'Auto-generated back-merge PR after a hotfix landed on main. Merge ASAP to keep integration in sync.\n\nSource hotfix: `%s`' "$SOURCE_REF")
          gh pr create \
            --base integration \
            --head "$BRANCH" \
            --title "chore(KAM-0000): back-merge hotfix from main to integration" \
            --body "$BODY"
