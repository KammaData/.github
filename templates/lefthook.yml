# Kamma shared lefthook configuration.
#
# Copy this file to the root of each Kamma application/library repo to wire
# up the commit-msg hook for conventional commit validation.
#
# Setup (one-time per repo):
#   npm install --save-dev @commitlint/cli @commitlint/config-conventional lefthook
#   npx lefthook install
#
# After install, every `git commit` runs commitlint on the message and rejects
# anything that doesn't match <type>(KAM-XXXX): <description>.
#
# Bypass (use sparingly):
#   git commit --no-verify -m "..."   # local only; CI will still reject

commit-msg:
  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

# Pre-push: nothing here by default. Repos can add their own pre-push checks
# (typecheck, tests) by appending a `pre-push:` block below.
